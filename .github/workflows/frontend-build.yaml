name: Frontend Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]
jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          package-json-file: frontend/package.json
          runtime: node@24
          install: false
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Build frontend
        run: just frontend build
