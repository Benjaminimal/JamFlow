name: Backend Test
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  backend-test:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: ./backend/docker-compose.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "backend/pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install just
        uses: extractions/setup-just@v3
      - name: Set up backend config
        run: mv ./backend/.env.test ./backend/.env
      - name: Setup FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Start services
        run: |
          docker compose up --detach db storage
          docker compose ps
      - name: Run tests
        run: just backend test
      - name: Clean up
        if: always()
        run: docker compose down db storage --volumes
